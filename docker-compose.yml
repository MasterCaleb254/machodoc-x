version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: machodoc
      POSTGRES_USER: machodoc
      POSTGRES_PASSWORD: machodoc_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ml-training:
    build: ./ml-models
    ports:
      - "8000:8000"
    volumes:
      - ./ml-models:/app
    environment:
      - DATABASE_URL=postgresql://machodoc:machodoc_dev@postgres:5432/machodoc

volumes:
  postgres_data:
